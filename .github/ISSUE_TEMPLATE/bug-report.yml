name: Bug Report
description: Report an issue
title: 'bug: '
assignees: []
labels:
  - type: fix
  - status: awaiting-triage
  - bug: unconfirmed

body:
  - type: markdown
    attributes:
      value: |
        ## Bug Description

        <!-- A clear and concise description of the bug. -->

  - type: textarea
    id: bug_description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: Describe the bug...

  - type: markdown
    attributes:
      value: |
        ## Reproducible By

        <!-- A step by step list to reproduce the bug for examination. -->

  - type: textarea
    id: reproducible_by
    attributes:
      label: Reproducible By
      description: Steps to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error

  - type: markdown
    attributes:
      value: |
        ## Expected Behavior

        <!-- A clear and concise description of what you expected to happen. -->

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.

  - type: markdown
    attributes:
      value: |
        ## Logs & Screenshots

        <!-- If applicable, add screenshots to help explain your problem, or alternatively add your console logs here. -->

  - type: textarea
    id: logs_screenshots
    attributes:
      label: Logs & Screenshots
      description: If applicable, add screenshots or console logs to help explain your problem.

  - type: markdown
    attributes:
      value: |
        ## Environment

        <!-- Your OS and environment information [e.g. Ubuntu 18.04 LTS, Node v14.14.0] -->

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Your OS and environment information (e.g. Ubuntu 18.04 LTS, Node v14.14.0)
      placeholder: OS and version, Node version, etc.

  - type: markdown
    attributes:
      value: |
        ### Additional context

        <!-- Add any other context about the problem here. -->

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
