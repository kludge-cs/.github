name: "CI: CodeQL Analysis"

on:
  workflow_call:
    inputs:
      languages:
        description: "Languages to analyse with CodeQL"
        required: false
        default: "javascript"
        type: string
      build_mode:
        description: "CodeQL build mode"
        required: false
        default: "none"
        type: string

jobs:
  analyze:
    name: Analyze ${{ inputs.languages }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    permissions:
      contents: read
      security-events: write

    steps:
      - name: "[INIT] Checkout repository"
        uses: actions/checkout@v4

      - name: "[INIT] Set up CodeQL"
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ inputs.languages }}
          build-mode: ${{ inputs.build_mode }}

      - name: "[EXEC] Perform analysis"
        uses: github/codeql-action/analyze@v4
